<html>
	<meta http-equiv="refresh" content="30" />
	<head>
		<link rel="stylesheet" href='/static/index.css' />
		<title>{{ title }}</title>
	</head>
	<body>
		<h1> Cano-pi-imager </h1>
		<h2> {{ time }} </h2>
		
		<div>
			<a href="/Green-led/on" class="button">Green Led ON</a>  
			<a href="/Green-led/off"class="button">Green Led OFF</a>
		</div>
		
		<h2> 
			Current ID: 
			<br>
			{{ current_id }}
		</h2>
		
		<form method="POST"> 
			<textarea name="textarea" class = "id_bttn"></textarea>
			<br>
			<input type="submit" value="Change current ID" class = "id_bttn"> 
		</form> 
		
		<h2>Exposure: {{ exposure_info }}</h2>
		<div>
			<a href="/exposure/decrease_big" class="exp_button">&minus;&minus;<br><small>1 stop</small></a>
			<a href="/exposure/decrease" class="exp_button">&minus;<br><small>1/3 stop</small></a>
			<a href="/exposure/auto" class="exp_button">Auto</a>
			<a href="/exposure/increase" class="exp_button">+<br><small>1/3 stop</small></a>
			<a href="/exposure/increase_big" class="exp_button">++<br><small>1 stop</small></a>
		</div>

		<a href="/Camera/take" class="take_button">Acquire</a>

		<h2> {{ picture }}</h2>
		<div class="preview">
			<img src="{{ ImageLink }}" class="disp_img" alt="Picture">
			{% if FocusLink %}
			<figure class="focus">
				<img src="{{ FocusLink }}" class="focus_img" alt="Centre crop">
				<figcaption>Centre 1:1 (focus check)</figcaption>
			</figure>
			{% endif %}
		</div>
	
	</body>
</html>
